<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee Hop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="jatekTer" class="jatek-ter tema-nappal">
        <div id="pontszam" class="pontszam-kijelzo">0</div>

        <div class="nap"></div>
        <div class="felho felho-1"></div>
        <div class="felho felho-2"></div>
        <div class="felho felho-3"></div>
        <div class="felho felho-4"></div>

      
        <div id="startKepernyo" class="start-kepernyo">
            <div class="logo-kontener">
                <h1 class="pixel-cim">Bee Hop</h1>
                <img src="mehecske.png" class="logo-mehecske" alt="Méhecske">
            </div>

            <div class="pontszam-eredmeny" style="font-size: 28px;">
                BEST: <span id="startRekordPontszam">0</span>
            </div>

            <div class="tema-valaszto">
                <button class="tema-kartya aktiv" onclick="valtsTemat('tema-nappal', this)">
                    <span class="kartya-ikon">🌞</span>
                    <span class="kartya-nev">DAY</span>
                </button>
                <button class="tema-kartya" onclick="valtsTemat('tema-ejszaka', this)">
                    <span class="kartya-ikon">🌙</span>
                    <span class="kartya-nev">NIGHT</span>
                </button>
                <button class="tema-kartya" onclick="valtsTemat('tema-cyberpunk', this)">
                    <span class="kartya-ikon">🏙️</span>
                    <span class="kartya-nev">CYBER</span>
                </button>
            </div>

            <div class="gomb-csoport">
                <button class="pixel-gomb" onclick="jatekInditasa()">START</button>
            </div>

            <div class="copyright">(c) Bee Hop Team 2026</div>
        </div>

       
        <div id="gameOverKepernyo" class="start-kepernyo" style="display: none;">
            <div class="logo-kontener">
                <h1 class="pixel-cim">Game Over</h1>
                <img src="mehecske.png" class="logo-mehecske" alt="Méhecske">
            </div>

            <div class="pontszam-eredmeny">
                POINTS: <span id="vegsoPontszam">0</span>
            </div>

            <div class="pontszam-eredmeny" style="font-size: 28px; margin-top: -10px;">
                BEST: <span id="rekordPontszam">0</span>
            </div>

            <div class="gomb-csoport">
                <button class="pixel-gomb" onclick="jatekInditasa()">RESTART</button>
                <button class="pixel-gomb" onclick="menubeVissza()">MENU</button>
            </div>

            <div class="copyright">(c) Bee Hop Team 2026</div>
        </div>

        <img src="mehecske.png" id="mehecske" class="mehecske-img" alt="Méhecske">
        <div class="talaj"></div>
    </div>

    <script src="bee.js"></script>
</body>
</html>
